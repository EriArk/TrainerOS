name: Native Linux build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-declarative-dev libqt6sql6-sqlite libsdl2-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-shapes \
            qml6-module-qtqml-workerscript qml6-module-qtqml-models
      - name: Configure
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/native --parallel 2
      - name: Test
        run: ctest --test-dir build/native --output-on-failure
