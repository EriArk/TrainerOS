[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traineros-backend"
version = "0.0.1"
description = "TrainerOS Backend local foundation; online product services remain unavailable"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "psycopg[binary,pool]>=3.2,<4", "uvicorn>=0.30,<1", "cryptography>=44,<48"]

[project.scripts]
traineros-backend = "trainer_backend.cli:main"

[tool.setuptools.packages.find]
include = ["trainer_backend*"]

[tool.setuptools.package-data]
trainer_backend = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
