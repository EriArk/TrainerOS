# Dedicated API tunnel; never reuse the Lobby or Crates tunnel configuration.
# Replace tunnel UUID and credentials path on the server only.
tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /home/REPLACE_WITH_USER/.cloudflared/REPLACE_WITH_TUNNEL_UUID.json
ingress:
  - hostname: traineros-api.abysstail.art
    path: ^/v1/.*$
    service: http://127.0.0.1:19120
  - hostname: traineros-api.abysstail.art
    path: ^/health/live$
    service: http://127.0.0.1:19120
  - service: http_status:404
