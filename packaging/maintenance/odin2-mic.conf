# TrainerOS Odin 2 internal capture route.
# Route evidence: Armada PR #432 and TechLuddite/omarchy-mobile-odin2,
# scripts/build-microphone-candidate.py (DMIC3 / MIC BIAS3 / SWR_MIC7).
# Requires the matching device-tree routes; exposing a PCM alone is insufficient.
SectionDevice."Mic" {
    Comment "Built-in microphone"
    EnableSequence [
        cset "name='ADC2 Switch' 0"
        cset "name='ADC2_MIXER Switch' 0"
        cset "name='DMIC3 Switch' 1"
        cset "name='DMIC3_MIXER Switch' 1"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' SWR_MIC7"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='DEC0 MODE' ADC_DEFAULT"
        cset "name='TX_DEC0 Volume' 100"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='DMIC3_MIXER Switch' 0"
        cset "name='DMIC3 Switch' 0"
    ]
    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},2"
        CaptureChannels 2
    }
}
